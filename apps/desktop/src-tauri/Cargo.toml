[package]
name = "bizspark-desktop"
version = "1.0.0"
description = "BizSpark - 本地商机诊断工具（Tauri 壳）"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
once_cell = "1"

[lib]
name = "bizspark_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
